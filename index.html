<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pawel &amp; Kinga Tasks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tasks">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #f5f6f8; --panel: #fff; --panel-2: #fafbfc; --ink: #14161a; --muted: #67707e; --faint: #9aa1ad;
    --line: #e4e7ec; --hover: #f0f2f5; --accent: #2563eb; --danger: #d92d20; --warn: #b54708; --warn-bg: #fff6e5;
    --now: #e5484d; --toast: #1d2026;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.07);
    --lift: 0 10px 28px rgba(16,24,40,.2);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1013; --panel: #16191e; --panel-2: #1b1e24; --ink: #e6e8ec; --muted: #9aa2af; --faint: #697180;
      --line: #272b32; --hover: #20242b; --accent: #5b8def; --danger: #f97066; --warn: #fdb022; --warn-bg: #2b2111;
      --now: #ff6369; --toast: #2a2e36; --shadow: none; --lift: 0 10px 28px rgba(0,0,0,.55); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1013; --panel: #16191e; --panel-2: #1b1e24; --ink: #e6e8ec; --muted: #9aa2af; --faint: #697180;
    --line: #272b32; --hover: #20242b; --accent: #5b8def; --danger: #f97066; --warn: #fdb022; --warn-bg: #2b2111;
    --now: #ff6369; --toast: #2a2e36; --shadow: none; --lift: 0 10px 28px rgba(0,0,0,.55); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  code, kbd { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--hover); padding: 1px 5px; border-radius: 5px; }
  .muted { color: var(--muted); }
  .grow { flex: 1; }

  /* Top bar */
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--bg); }
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 8px;
    padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 7px; font-weight: 650; margin-right: 4px; }
  .brand svg { color: var(--accent); }
  .seg { display: flex; background: var(--hover); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; color: var(--muted); font-weight: 550; }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
  #accts { display: flex; gap: 6px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 13px; white-space: nowrap; }
  .pill.off .dot { background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
  .pill.exp { border-color: var(--warn); color: var(--warn); background: var(--warn-bg); }
  .pill.demo { cursor: default; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
  .icon { border: 0; background: none; width: 32px; height: 32px; border-radius: 8px; display: inline-grid; place-items: center; cursor: pointer; color: var(--muted); flex: none; }
  .icon:hover { background: var(--hover); color: var(--ink); }
  .spin svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 550; font-size: 13px;
    text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--danger); }

  main { max-width: 1180px; margin: 0 auto; padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 8px 8px 14px; margin-bottom: 14px; color: var(--muted); font-size: 13px; }

  /* Board */
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; align-items: start; }
  .col { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: 12px; box-shadow: var(--shadow); min-width: 0; }
  .col.over { box-shadow: 0 0 0 2px var(--c); }
  .col-h { display: flex; align-items: center; gap: 8px; padding: 11px 14px 8px; }
  .col-h b { font-size: 15px; }
  .col-h .email { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .col-h .r { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
  .col-h select { max-width: 150px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); font-size: 12px; }
  .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .add { padding: 0 10px 4px; }
  .add input { width: 100%; border: 1px dashed var(--line); background: transparent; border-radius: 8px; padding: 8px 10px; }
  .add input:focus { outline: none; border-style: solid; border-color: var(--c); background: var(--panel-2); }
  .list { list-style: none; margin: 0; padding: 2px 6px 8px; min-height: 44px; }
  .none { color: var(--faint); font-size: 13px; padding: 10px 8px; list-style: none; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; min-height: 36px; border-radius: 8px; position: relative; outline: none; cursor: pointer;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; list-style: none; }
  .row:hover { background: var(--hover); }
  .row:focus-visible { box-shadow: inset 0 0 0 2px var(--c); }
  .row.open { background: var(--hover); }
  .row.sub { padding-left: 32px; }
  .title { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .done > .title { color: var(--faint); text-decoration: line-through; }
  .grip { color: var(--faint); opacity: 0; cursor: grab; display: inline-grid; place-items: center; width: 12px; margin-left: -4px; flex: none; touch-action: none; }
  .row:hover .grip, .item:hover .grip { opacity: 1; }
  .item .grip, .chip .grip { display: none; }
  @media (pointer: coarse) {
    .grip { opacity: .75; width: 30px; height: 32px; margin: -6px -6px -6px -10px; }
    .item .grip, .chip .grip { display: inline-grid; }
    .row { min-height: 46px; }
    .item { min-height: 42px; }
    .chk { width: 22px; height: 22px; }
    .chip .chk { width: 20px; height: 20px; }
    .chip .x { font-size: 20px; padding: 0 6px; }
    input, textarea, select { font-size: 16px !important; }   /* stops iPhone zooming in on focus */
  }
  .chk { flex: none; width: 18px; height: 18px; padding: 0; border-radius: 50%; border: 1.8px solid var(--c); background: transparent; color: transparent;
    display: grid; place-items: center; cursor: pointer; }
  .chk:hover { background: color-mix(in srgb, var(--c) 15%, transparent); color: var(--c); }
  .done > .chk { background: var(--c); color: #fff; }
  .meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; flex: none; }
  .due { padding: 1px 6px; border-radius: 5px; background: var(--hover); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
  .row:hover .due, .row.open .due { background: var(--panel); }
  .due.over { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .editor { list-style: none; margin: 2px 0 8px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); display: grid; gap: 8px; }
  .editor input, .editor textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; min-width: 0; }
  .editor textarea { resize: vertical; min-height: 56px; }
  .editor input:focus, .editor textarea:focus { outline: none; border-color: var(--c); }
  .ed-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ed-row label { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
  .donebox summary { cursor: pointer; color: var(--muted); font-size: 12px; padding: 4px 14px 10px; list-style: none; width: max-content; }
  .donebox summary::-webkit-details-marker { display: none; }
  .donebox summary::before { content: "▸ "; }
  .donebox[open] summary::before { content: "▾ "; }
  .empty { padding: 26px 16px 30px; text-align: center; color: var(--muted); }
  .empty p { margin: 0 0 12px; }
  .expired { display: flex; align-items: center; gap: 10px; margin: 0 10px 8px; padding: 6px 6px 6px 10px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); font-size: 13px; }
  .keys { color: var(--faint); font-size: 12px; text-align: center; margin: 18px 0 4px; }
  .keys kbd { font-size: 11px; }
  @media (pointer: coarse) { .keys { display: none; } }

  /* Drag & drop */
  .dragging { opacity: .35; }
  .ghost { position: fixed !important; left: 0; top: 0; z-index: 100; pointer-events: none; margin: 0 !important; background: var(--panel) !important;
    box-shadow: var(--lift); border-radius: 8px; opacity: .96; }
  body.is-dragging, body.is-dragging * { cursor: grabbing !important; }
  #dropline { position: fixed; height: 2px; background: var(--accent); border-radius: 2px; z-index: 90; display: none; pointer-events: none; }
  #dropline::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

  /* Day view */
  .dayhead { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .dayhead h2 { font-size: 17px; margin: 0 6px; }
  .dayhead input[type="date"] { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 8px; font-size: 13px; }
  .legend { display: flex; gap: 12px; color: var(--muted); font-size: 12px; }
  .legend > span { display: inline-flex; align-items: center; gap: 5px; }
  .day { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 16px; align-items: start; }
  .side { position: sticky; top: calc(62px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 78px - env(safe-area-inset-top, 0px)); overflow: auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px; box-shadow: var(--shadow); }
  .side.over { box-shadow: 0 0 0 2px var(--accent); }
  .side-h { display: flex; align-items: center; gap: 8px; padding: 2px 4px 4px; }
  .side-h input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--panel-2); border-radius: 7px; padding: 4px 8px; font-size: 13px; }
  .side h4 { margin: 12px 6px 2px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .items { list-style: none; margin: 0; padding: 0; }
  .item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; list-style: none; }
  .item:hover { background: var(--hover); }
  .item.picked, .chip.picked { box-shadow: 0 0 0 2px var(--accent); }
  .hint { color: var(--faint); font-size: 12px; margin: 14px 6px 4px; }
  .pickbar { position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 15; display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
    padding: 6px 6px 6px 12px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 14%, var(--bg)); box-shadow: var(--shadow); font-size: 13px; }
  .grid { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .slot, .allday { display: flex; min-height: 34px; }
  .slot { border-top: 1px dashed color-mix(in srgb, var(--line) 75%, transparent); }
  .slot.hour { border-top: 1px solid var(--line); }
  .slot:first-child, .allday + .slot { border-top-style: solid; }
  .allday { border-bottom: 1px solid var(--line); }
  .tl { width: 58px; flex: none; padding: 7px 8px 0 0; text-align: right; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sb { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px; padding: 4px 8px 4px 6px; border-left: 1px solid var(--line); }
  .slot.busy .sb { background: color-mix(in srgb, var(--busy) 9%, transparent); }
  .slot.over .sb { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .grid.picking .slot { cursor: pointer; }
  .grid.picking .slot:hover .sb { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .slot.now .tl { color: var(--now); font-weight: 650; }
  .slot.now .sb { box-shadow: inset 3px 0 0 var(--now); }
  .chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 4px 3px 7px; background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--c); border-radius: 7px; font-size: 13px; cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; box-shadow: var(--shadow); }
  .chip .chk { width: 16px; height: 16px; }
  .chip .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .tm { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chip .x { border: 0; background: none; color: var(--faint); cursor: pointer; padding: 0 4px; font-size: 16px; line-height: 1; }
  .chip .x:hover { color: var(--ink); }
  .ev { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--muted);
    padding: 2px 7px; border-radius: 6px; border-left: 3px solid var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); }
  .ev b { font-weight: 600; font-variant-numeric: tabular-nums; }
  @media (max-width: 760px) {
    .day { grid-template-columns: minmax(0, 1fr); }
    .side { position: static; max-height: 42vh; max-height: 42dvh; }
  }
  @media (max-width: 560px) {
    .top { gap: 6px; }
    .brand span, .pill .lbl { display: none; }
    .seg button { padding: 5px 10px; }
    main { padding-block: 12px; }
  }

  /* Toasts & dialog */
  #toasts { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: grid; gap: 8px; z-index: 200; width: min(460px, calc(100% - 32px)); }
  .toast { display: flex; align-items: center; gap: 12px; background: var(--toast); color: #fff; border-radius: 10px; padding: 10px 14px; box-shadow: var(--lift); font-size: 13px; }
  .toast span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .toast button { background: none; border: 0; color: #9dbdff; font-weight: 650; cursor: pointer; padding: 0; }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); padding: 0; width: min(580px, calc(100% - 32px)); box-shadow: var(--lift); }
  dialog::backdrop { background: rgba(10, 12, 16, .45); }
  .settings { padding: 18px 20px; display: grid; gap: 12px; }
  .settings header { display: flex; align-items: center; justify-content: space-between; }
  .settings h2 { margin: 0; font-size: 17px; }
  .steps { margin: 0; padding-left: 20px; color: var(--muted); display: grid; gap: 6px; font-size: 13px; }
  .steps b { color: var(--ink); font-weight: 600; }
  .field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .field input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); font-size: 13px; }
  .acct-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 8px 0 0; border-top: 1px solid var(--line); font-size: 13px; }
  .settings footer { display: flex; justify-content: flex-end; gap: 8px; }
  .warn { margin: 0; padding: 8px 10px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); font-size: 13px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand" id="brand"><span>Tasks</span></div>
  <div class="seg" aria-label="View">
    <button data-act="view" data-view="board" title="Board (B)">Board</button>
    <button data-act="view" data-view="day" title="Day (D)">Day</button>
  </div>
  <span class="grow"></span>
  <div id="accts"></div>
  <button class="icon" id="sync-btn" data-act="sync" title="Sync now (R)" aria-label="Sync now"></button>
  <button class="icon" id="gear-btn" data-act="settings" title="Settings" aria-label="Settings"></button>
</header>
<main id="main"></main>
<div id="dropline"></div>
<div id="toasts" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script>
'use strict';

// ---------------------------------------------------------------------------
// Configuration
// ---------------------------------------------------------------------------
const CONFIG = {
  // Google OAuth "Web application" client ID. Leave empty to paste it in Settings instead.
  clientId: '',
  // One column per person. Each column learns its Google account the first time you connect it on a device.
  // `email` is optional: fill it in to pre-select that account in Google's sign-in (it becomes public on a public site).
  accounts: [
    { key: 'pawel', name: 'Pawel', email: '', color: '#4c6ef5' },
    { key: 'kinga', name: 'Kinga', email: '', color: '#f76707' },
  ],
  dayStart: 7,          // first hour shown in Day view
  dayEnd: 22,           // Day view runs until this hour
  showCalendar: true,   // show Google Calendar events (read-only) in Day view
  completedDays: 7,     // show tasks completed in the last N days
};

const TASKS_API = 'https://tasks.googleapis.com/tasks/v1';
const CAL_API = 'https://www.googleapis.com/calendar/v3';
const SCOPE_TASKS = 'https://www.googleapis.com/auth/tasks';
const SCOPE_CAL = 'https://www.googleapis.com/auth/calendar.events.readonly';
const SCOPE_EMAIL = 'https://www.googleapis.com/auth/userinfo.email';
// The Tasks API can't store a time of day, so the planned time lives in the notes as "⏰ 14:30".
const TIME_LINE = /^\s*⏰️?\s?([01]?\d|2[0-3]):([0-5]\d)\s*$/;
// Inside a frame (a Claude Artifact or a preview panel) Google sign-in can't open, so the page runs on sample tasks.
const PREVIEW = (() => { try { return window.self !== window.top; } catch { return true; } })();

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const enc = encodeURIComponent;
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => keyOf(new Date());
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const toMin = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
const toHHMM = min => `${pad(Math.floor(min / 60))}:${pad(min % 60)}`;
const nowMinutes = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const newUid = () => 'u' + Math.random().toString(36).slice(2, 10);
const tmpId = () => 'tmp_' + Math.random().toString(36).slice(2, 10);

function dayLabel(k) {
  const t = todayKey();
  if (k === t) return 'Today';
  if (k === addDays(t, 1)) return 'Tomorrow';
  if (k === addDays(t, -1)) return 'Yesterday';
  const d = parseKey(k);
  const opts = { weekday: 'short', day: 'numeric', month: 'short' };
  if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString(undefined, opts);
}

function splitNotes(raw) {
  const lines = (raw || '').split('\n');
  const i = lines.findIndex(l => TIME_LINE.test(l));
  if (i < 0) return { notes: raw || '', time: null };
  const [, h, m] = lines[i].match(TIME_LINE);
  lines.splice(i, 1);
  return { notes: lines.join('\n').replace(/\s+$/, ''), time: `${pad(h)}:${m}` };
}
const composeNotes = t => [t.notes, t.time ? '⏰ ' + t.time : ''].filter(Boolean).join('\n');

const store = {
  get(k, fallback) { try { const v = localStorage.getItem('taskhub.' + k); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(k, v) { try { localStorage.setItem('taskhub.' + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem('taskhub.' + k); } catch {} },
};

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const prefs = store.get('prefs', {});
const S = {
  clientId: PREVIEW ? '' : CONFIG.clientId || prefs.clientId || '',
  view: prefs.view === 'day' ? 'day' : 'board',
  savedLists: prefs.lists || {},
  date: todayKey(),
  open: null,        // uid of the task whose editor is open
  pick: null,        // uid picked for tap-to-schedule
  focus: null,       // uid to focus after the next render
  sideFilter: '',
  drafts: {},        // quick-add input drafts per account
  doneOpen: {},      // completed section expanded per account
  soon: 0,
};
S.demo = !S.clientId;

const ORDER = CONFIG.accounts.map(a => a.key);
const ACC = {};
for (const c of CONFIG.accounts) {
  const tok = store.get('tok.' + c.key, null) || {};
  ACC[c.key] = {
    ...c, token: tok.token || null, exp: tok.exp || 0, cal: !!tok.cal, who: tok.email || null,
    lists: [], listId: null, tasks: [], events: {},
    q: Promise.resolve(), ver: 0, loading: false, synced: 0, calWarned: false,
  };
}
const live = a => !!a.token && Date.now() < a.exp - 30000;
const pendingDel = new Set();   // task objects deleted locally, waiting for their undo window

function savePrefs() {
  if (!S.demo) for (const k of ORDER) if (ACC[k].listId) S.savedLists[k] = ACC[k].listId;
  store.set('prefs', { clientId: CONFIG.clientId ? undefined : S.clientId, view: S.view, lists: S.savedLists });
}

const isActive = t => t.status !== 'completed';
const allTasks = () => ORDER.flatMap(k => ACC[k].tasks);
function T(uid) {
  for (const k of ORDER) { const t = ACC[k].tasks.find(x => x.uid === uid); if (t) return t; }
  return null;
}
// Open top-level tasks of the selected list, in display order. Subtasks whose parent is done show up here too.
function visibleTops(k) {
  const a = ACC[k];
  const active = a.tasks.filter(t => t.listId === a.listId && isActive(t));
  const ids = new Set(active.map(t => t.id));
  return active.filter(t => !t.parent || !ids.has(t.parent));
}
const childrenOf = t => ACC[t.acct].tasks.filter(c => c.parent && c.parent === t.id);
// Google positions a task by naming the open top-level sibling right before it.
function prevTopId(t) {
  const sib = ACC[t.acct].tasks.filter(x => x.listId === t.listId && !x.parent && isActive(x));
  const i = sib.indexOf(t);
  return i > 0 ? sib[i - 1].id : null;
}
const taskPath = t => `/lists/${enc(t.listId)}/tasks/${enc(t.id)}`;
function toBody(t) {
  const b = { title: t.title, status: t.status };
  const notes = composeNotes(t);
  if (notes) b.notes = notes;
  if (t.due) b.due = t.due + 'T00:00:00.000Z';
  if (t.status === 'completed' && t.completed) b.completed = t.completed;
  return b;
}
function adopt(t, r) {
  if (!r) return;
  const old = t.id;
  t.id = r.id;
  t.position = r.position || t.position;
  t.link = r.webViewLink || t.link;
  if (old !== r.id) for (const c of ACC[t.acct].tasks) if (c.parent === old) c.parent = r.id;
}

// ---------------------------------------------------------------------------
// Google API
// ---------------------------------------------------------------------------
class AuthError extends Error {}

async function api(k, method, path, { query, body, base = TASKS_API } = {}) {
  const a = ACC[k];
  if (!live(a)) throw new AuthError('expired');
  const url = new URL(base + path);
  for (const [name, v] of Object.entries(query || {})) if (v != null && v !== '') url.searchParams.set(name, v);
  const res = await fetch(url, {
    method,
    headers: { Authorization: 'Bearer ' + a.token, ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { a.exp = 0; throw new AuthError('expired'); }
  if (!res.ok) {
    let msg = 'HTTP ' + res.status;
    try { msg = (await res.json()).error?.message || msg; } catch {}
    throw new Error(msg);
  }
  if (res.status === 204) return null;
  return res.json().catch(() => null);
}

async function pageAll(k, path, query, base) {
  const out = [];
  let pageToken;
  do {
    const r = await api(k, 'GET', path, { query: { maxResults: 100, ...query, pageToken }, base });
    out.push(...(r?.items || []));
    pageToken = r?.nextPageToken;
  } while (pageToken);
  return out;
}

// Every write for an account runs in order through one queue, so a task created a moment ago
// already has its real Google id by the time the next change to it is sent.
function enqueue(k, fn) {
  const a = ACC[k];
  const p = a.q.then(fn);
  a.q = p.catch(err => apiFailed(k, err));
  return p;
}
function remote(k, fn) {
  if (S.demo) return Promise.resolve();
  ACC[k].ver++;
  return enqueue(k, fn);
}
function apiFailed(k, err) {
  const a = ACC[k];
  render();
  if (err instanceof AuthError) return toast(`${a.name}'s Google session expired.`, { label: 'Reconnect', run: () => reconnect(k) });
  console.error(err);
  toast(`Couldn't save to ${a.name}'s Google Tasks (${String(err.message).slice(0, 140)}). Reloading.`);
  setTimeout(() => sync(k), 400);
}
function guard(k) {
  if (S.demo || live(ACC[k])) return true;
  toast(`Reconnect ${ACC[k].name} first.`, { label: 'Reconnect', run: () => reconnect(k) });
  render();
  return false;
}

function sync(k) {
  const a = ACC[k];
  if (S.demo || !live(a)) { render(); return Promise.resolve(); }
  return enqueue(k, async () => {
    a.loading = true;
    renderHeader();
    const ver = a.ver;
    try {
      const lists = await pageAll(k, '/users/@me/lists', {});
      const since = new Date(Date.now() - CONFIG.completedDays * 864e5).toISOString();
      const perList = await Promise.all(lists.map(async l => {
        const [open, done] = await Promise.all([
          pageAll(k, `/lists/${enc(l.id)}/tasks`, { showCompleted: false }),
          pageAll(k, `/lists/${enc(l.id)}/tasks`, { showCompleted: true, showHidden: true, completedMin: since }),
        ]);
        return arrange(k, l.id, open.filter(x => x.status !== 'completed'), done.filter(x => x.status === 'completed'));
      }));
      if (a.ver !== ver) { setTimeout(() => sync(k)); return; }   // local edits landed meanwhile; read again after them
      a.lists = lists.map(l => ({ id: l.id, title: l.title }));
      if (!a.lists.some(l => l.id === a.listId)) a.listId = a.lists.find(l => l.id === S.savedLists[k])?.id || a.lists[0]?.id || null;
      a.tasks = perList.flat();
      a.synced = Date.now();
      savePrefs();
    } catch (err) {
      if (err instanceof AuthError) toast(`${a.name}'s Google session expired.`, { label: 'Reconnect', run: () => reconnect(k) });
      else toast(`Couldn't load ${a.name}'s tasks: ${String(err.message).slice(0, 160)}`);
    } finally {
      a.loading = false;
    }
    render();
    if (S.view === 'day') loadEvents(k, S.date);
  });
}

function arrange(k, listId, open, done) {
  const known = new Map(ACC[k].tasks.map(t => [t.id, t.uid]));
  const gone = new Set([...pendingDel].map(t => t.id));
  const norm = x => {
    const { notes, time } = splitNotes(x.notes);
    return {
      uid: known.get(x.id) || newUid(), id: x.id, acct: k, listId, title: x.title || '', notes, time,
      due: x.due ? x.due.slice(0, 10) : null, status: x.status, parent: x.parent || null,
      position: x.position || '', completed: x.completed || null, link: x.webViewLink || null,
    };
  };
  const byPos = (p, q) => (p.position < q.position ? -1 : p.position > q.position ? 1 : 0);
  return [
    ...open.map(norm).sort(byPos),
    ...done.map(norm).sort((p, q) => (q.completed || '').localeCompare(p.completed || '')),
  ].filter(t => !gone.has(t.id));
}

async function loadEvents(k, date) {
  const a = ACC[k];
  if (S.demo || !CONFIG.showCalendar || !a.cal || !live(a)) return;
  const t0 = parseKey(date), t1 = parseKey(addDays(date, 1));
  try {
    const items = await pageAll(k, '/calendars/primary/events',
      { timeMin: t0.toISOString(), timeMax: t1.toISOString(), singleEvents: true, orderBy: 'startTime' }, CAL_API);
    const clock = d => (d <= t0 ? 0 : d >= t1 ? 1440 : d.getHours() * 60 + d.getMinutes());
    a.events[date] = items
      .filter(e => e.status !== 'cancelled' && e.eventType !== 'workingLocation'
        && !(e.attendees || []).some(p => p.self && p.responseStatus === 'declined'))
      .map(e => e.start?.dateTime
        ? { title: e.summary || '(busy)', allDay: false, start: clock(new Date(e.start.dateTime)), end: clock(new Date(e.end.dateTime)) }
        : { title: e.summary || '(busy)', allDay: true });
    if (S.view === 'day' && S.date === date) render();
  } catch (err) {
    if (!a.calWarned && !(err instanceof AuthError)) {
      a.calWarned = true;
      toast(`Calendar events for ${a.name} unavailable: ${String(err.message).slice(0, 120)}`);
    }
  }
}
const loadEventsAll = () => ORDER.forEach(k => loadEvents(k, S.date));
const syncAll = () => {
  if (S.demo) return toast('Demo data. Connect Google Tasks in Settings to sync.', { label: 'Settings', run: openSettings });
  const expired = ORDER.find(k => ACC[k].token && !live(ACC[k]));
  ORDER.forEach(k => live(ACC[k]) && sync(k));
  if (expired) toast(`${ACC[expired].name}'s session expired.`, { label: 'Reconnect', run: () => reconnect(expired) });
};

// ---------------------------------------------------------------------------
// Sign-in: Google's redirect flow. Works in every browser and in Home Screen apps; no server, no secrets.
// ---------------------------------------------------------------------------
const AUTH_URL = 'https://accounts.google.com/o/oauth2/v2/auth';
const redirectUri = () => location.origin + location.pathname.replace(/index\.html$/, '');
const QUIET_RETRY_MS = 120000;

function connect(k, quiet = false) {
  const a = ACC[k];
  if (PREVIEW || S.demo) return openSettings();
  if (location.protocol === 'file:') { toast('Google sign-in needs http://localhost or https. See Settings.'); return openSettings(); }
  const state = `${k}.${Math.random().toString(36).slice(2)}${Date.now().toString(36)}`;
  store.set('signin', { state, k, quiet });
  const p = new URLSearchParams({
    client_id: S.clientId,
    redirect_uri: redirectUri(),
    response_type: 'token',
    scope: [SCOPE_TASKS, SCOPE_EMAIL, CONFIG.showCalendar ? SCOPE_CAL : ''].filter(Boolean).join(' '),
    include_granted_scopes: 'true',
    state,
  });
  const hint = a.who || a.email;
  if (hint) p.set('login_hint', hint);
  if (quiet) p.set('prompt', 'none');
  else if (!hint) p.set('prompt', 'select_account');
  location.assign(`${AUTH_URL}?${p}`);
}

// Reconnect without any Google screens when Google still remembers the account; otherwise show sign-in.
function reconnect(k) {
  const tried = store.get('quiet', {});
  if (ACC[k].who && Date.now() - (tried[k] || 0) > QUIET_RETRY_MS) {
    store.set('quiet', { ...tried, [k]: Date.now() });
    connect(k, true);
  } else {
    connect(k);
  }
}

// When the app opens, refresh expired Google sessions one account at a time (each is a quick bounce via Google).
function renewExpired() {
  if (S.demo || PREVIEW || location.protocol === 'file:') return false;
  const tried = store.get('quiet', {});
  const k = ORDER.find(x => ACC[x].who && !live(ACC[x]) && Date.now() - (tried[x] || 0) > QUIET_RETRY_MS);
  if (!k) return false;
  store.set('quiet', { ...tried, [k]: Date.now() });
  connect(k, true);
  return true;
}

async function finishSignIn() {
  if (!/(^|[#&])state=/.test(location.hash)) return;
  const h = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', location.pathname + location.search);
  const pending = store.get('signin', null);
  store.del('signin');
  const a = pending && pending.state === h.get('state') ? ACC[pending.k] : null;
  if (!a) return toast('That Google sign-in didn\'t start on this page. Try Connect again.');
  if (h.get('error')) {
    if (!pending.quiet) {
      toast(h.get('error') === 'access_denied' ? 'Google sign-in was cancelled.' : `Google sign-in failed (${h.get('error')}). Check the steps in Settings.`);
    }
    return;
  }
  const granted = h.has('scope') ? h.get('scope').split(' ') : [SCOPE_TASKS, SCOPE_CAL];
  if (!granted.includes(SCOPE_TASKS)) return toast('Google Tasks access wasn\'t granted, so nothing can be loaded.');
  const token = h.get('access_token');
  let email = null;
  try {
    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + token } });
    if (res.ok) email = (await res.json()).email || null;
  } catch {}
  const clash = email && ORDER.find(o => o !== pending.k && (ACC[o].who || '').toLowerCase() === email.toLowerCase());
  if (clash) return toast(`${email} is already in ${ACC[clash].name}'s column. Connect ${a.name} with the other Google account.`);
  Object.assign(a, {
    token,
    exp: Date.now() + (Number(h.get('expires_in')) || 3600) * 1000,
    cal: CONFIG.showCalendar && granted.includes(SCOPE_CAL),
    who: email || a.who || a.email || null,
  });
  store.set('tok.' + pending.k, { token: a.token, exp: a.exp, cal: a.cal, email: a.who });
  const tried = store.get('quiet', {});
  delete tried[pending.k];
  store.set('quiet', tried);
}

function disconnect(k) {
  const a = ACC[k];
  // Google's revoke endpoint has no CORS, so this is fire-and-forget.
  if (a.token) fetch('https://oauth2.googleapis.com/revoke?token=' + enc(a.token), { method: 'POST', mode: 'no-cors' }).catch(() => {});
  Object.assign(a, { token: null, exp: 0, who: null, cal: false, tasks: [], lists: [], events: {}, synced: 0, listId: null });
  store.del('tok.' + k);
  render();
  openSettings();
}

// ---------------------------------------------------------------------------
// Changes (applied locally right away, then sent to Google)
// ---------------------------------------------------------------------------
function blankTask(k, listId, title) {
  return { uid: newUid(), id: tmpId(), acct: k, listId, title, notes: '', time: null, due: null,
    status: 'needsAction', parent: null, position: '', completed: null, link: null };
}

function addTasks(k, titles) {
  if (!guard(k)) return;
  const a = ACC[k];
  if (!a.listId) return;
  const items = titles.map(s => s.trim()).filter(Boolean).map(title => blankTask(k, a.listId, title));
  if (!items.length) return;
  const first = a.tasks.findIndex(t => t.listId === a.listId);
  a.tasks.splice(first < 0 ? a.tasks.length : first, 0, ...items);
  render();
  remote(k, async () => {
    let prev = null;
    for (const t of items) {
      adopt(t, await api(k, 'POST', `/lists/${enc(t.listId)}/tasks`, { query: { previous: prev }, body: toBody(t) }));
      prev = t.id;
    }
  });
}

function patch(t, fields, lazy) {
  if (!guard(t.acct)) return;
  const hadTime = !!t.time;
  Object.assign(t, fields);
  if (!t.due) t.time = null;
  const body = {};
  if ('title' in fields) body.title = t.title;
  if ('due' in fields) body.due = t.due ? t.due + 'T00:00:00.000Z' : null;
  if ('notes' in fields || 'time' in fields || (hadTime && !t.time)) body.notes = composeNotes(t);
  lazy ? renderSoon() : render();
  remote(t.acct, () => api(t.acct, 'PATCH', taskPath(t), { body }));
}

function schedule(t, date, time) {
  if (t.due === date && t.time === time) return;
  patch(t, { due: date, time });
}

function toggleDone(t) {
  if (!guard(t.acct)) return;
  const a = ACC[t.acct];
  const completing = isActive(t);
  t.status = completing ? 'completed' : 'needsAction';
  t.completed = completing ? new Date().toISOString() : null;
  if (completing) t.doneHere = true;
  else if (!t.doneHere) {
    // Completed before this session: put it back where Google keeps it.
    a.tasks.splice(a.tasks.indexOf(t), 1);
    let i = a.tasks.findIndex(x => x.listId === t.listId && isActive(x) && !x.parent && x.position > t.position);
    if (i < 0) { i = a.tasks.findIndex(x => x.listId === t.listId && !isActive(x)); if (i < 0) i = a.tasks.length; }
    a.tasks.splice(i, 0, t);
  }
  render();
  remote(t.acct, () => api(t.acct, 'PATCH', taskPath(t), {
    body: completing ? { status: 'completed' } : { status: 'needsAction', completed: null },
  }));
  if (completing) toast(`Done: ${t.title}`, { label: 'Undo', run: () => toggleDone(t) });
}

function del(t) {
  if (!guard(t.acct)) return;
  const a = ACC[t.acct];
  const group = [...childrenOf(t), t];   // subtasks first, then the task
  const saved = a.tasks.map((x, i) => [x, i]).filter(([x]) => group.includes(x));
  a.tasks = a.tasks.filter(x => !group.includes(x));
  group.forEach(x => pendingDel.add(x));
  if (S.open === t.uid) S.open = null;
  render();
  let undone = false;
  const release = () => group.forEach(x => pendingDel.delete(x));
  const timer = setTimeout(() => {
    if (undone) return;
    if (S.demo) return release();
    remote(t.acct, async () => {
      for (const x of group) if (!x.id.startsWith('tmp_')) await api(t.acct, 'DELETE', taskPath(x));
    }).then(release, release);
  }, 5000);
  toast(`Deleted: ${t.title}`, {
    label: 'Undo',
    run: () => {
      undone = true;
      clearTimeout(timer);
      release();
      for (const [x, i] of saved) a.tasks.splice(Math.min(i, a.tasks.length), 0, x);
      render();
    },
  }, 5000);
}

// Reorder within one account; beforeUid = the top-level task to land above (null = bottom).
function reorder(t, beforeUid) {
  if (!guard(t.acct)) return;
  const a = ACC[t.acct];
  const anchor = beforeUid ? T(beforeUid) : null;
  if (anchor === t) return;
  const wasSub = !!t.parent;
  const prevBefore = prevTopId(t);
  a.tasks.splice(a.tasks.indexOf(t), 1);
  let i = anchor && anchor.acct === t.acct ? a.tasks.indexOf(anchor) : -1;
  if (i < 0) {
    a.tasks.forEach((x, j) => { if (x.listId === t.listId && isActive(x)) i = j; });
    i = i < 0 ? a.tasks.length : i + 1;
  }
  a.tasks.splice(i, 0, t);
  t.parent = null;
  render();
  if (!wasSub && prevTopId(t) === prevBefore) return;
  remote(t.acct, () => api(t.acct, 'POST', taskPath(t) + '/move', { query: { previous: prevTopId(t) } })
    .then(r => { if (r) t.position = r.position; }));
}

// Hand a task (and its subtasks) to another account: create it there, then delete the original.
function moveAcross(t, to, beforeUid) {
  const from = t.acct;
  if (from === to || !guard(from) || !guard(to)) return;
  const A = ACC[from], B = ACC[to];
  if (!B.listId) return toast(`${B.name} has no task list loaded yet.`);
  if (beforeUid === 'top') beforeUid = visibleTops(to)[0]?.uid || null;
  const kids = childrenOf(t);
  A.tasks = A.tasks.filter(x => x !== t && !kids.includes(x));
  const copy = x => ({ ...x, uid: newUid(), id: tmpId(), acct: to, listId: B.listId, link: null, position: '', doneHere: false });
  const nt = { ...copy(t), parent: null };
  const nkids = kids.map(c => ({ ...copy(c), parent: nt.id }));
  const anchor = beforeUid ? B.tasks.find(x => x.uid === beforeUid) : null;
  B.tasks.splice(anchor ? B.tasks.indexOf(anchor) : B.tasks.length, 0, nt, ...nkids);
  for (const key of ['open', 'pick', 'focus']) if (S[key] === t.uid) S[key] = nt.uid;
  render();
  if (S.demo) return;
  const created = remote(to, async () => {
    adopt(nt, await api(to, 'POST', `/lists/${enc(nt.listId)}/tasks`, { query: { previous: prevTopId(nt) }, body: toBody(nt) }));
    let prev = null;
    for (const c of nkids.filter(isActive)) {
      adopt(c, await api(to, 'POST', `/lists/${enc(c.listId)}/tasks`, { query: { parent: nt.id, previous: prev }, body: toBody(c) }));
      prev = c.id;
    }
    for (const c of nkids.filter(x => !isActive(x))) {
      adopt(c, await api(to, 'POST', `/lists/${enc(c.listId)}/tasks`, { query: { parent: nt.id }, body: toBody(c) }));
    }
  });
  remote(from, async () => {
    await created;   // never delete the original unless the copy exists
    for (const x of [...kids, t]) await api(from, 'DELETE', taskPath(x));
  });
}

function nudge(t, dir) {
  const tops = visibleTops(t.acct);
  const i = tops.indexOf(t);
  if (i < 0) return;
  S.focus = t.uid;
  if (dir < 0 && i > 0) reorder(t, tops[i - 1].uid);
  else if (dir > 0 && i < tops.length - 1) reorder(t, tops[i + 2]?.uid || null);
  else render();
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function renderSoon() { clearTimeout(S.soon); S.soon = setTimeout(render, 300); }

function render() {
  if (drag && drag.active) { drag.dirty = true; return; }
  clearTimeout(S.soon);
  const main = $('#main');
  const ae = document.activeElement;
  let keep = null, focusUid = S.focus;
  if (ae && main.contains(ae)) {
    if (ae.id && ae.matches('input, textarea')) keep = { id: ae.id, value: ae.value, a: ae.selectionStart, b: ae.selectionEnd };
    else if (!focusUid && ae.matches('.row')) focusUid = ae.dataset.uid;
  }
  const sideScroll = $('#side')?.scrollTop || 0;
  S.focus = null;
  renderHeader();
  const banner = !S.demo ? '' : PREVIEW
    ? `<div class="banner"><span>Preview with sample tasks. Live Google Tasks sync works in the copy of this file you run yourself.</span><button class="btn primary" data-act="settings">How to connect</button></div>`
    : `<div class="banner"><span>Demo data, nothing is saved. Connect Google Tasks to work with your real lists.</span><button class="btn primary" data-act="settings">Connect</button></div>`;
  main.innerHTML = banner + (S.view === 'day' ? dayHTML() : boardHTML());
  if ($('#side')) $('#side').scrollTop = sideScroll;
  if (keep) {
    const el = document.getElementById(keep.id);
    if (el) { el.value = keep.value; el.focus({ preventScroll: true }); try { el.setSelectionRange(keep.a, keep.b); } catch {} }
  } else if (focusUid) {
    document.querySelector(`.row[data-uid="${focusUid}"]`)?.focus();
  }
}

function renderHeader() {
  document.querySelectorAll('[data-act="view"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === S.view)));
  $('#accts').innerHTML = S.demo
    ? `<span class="pill demo">Demo</span>`
    : ORDER.map(k => {
        const a = ACC[k];
        const st = !a.token ? 'off' : live(a) ? 'ok' : 'exp';
        const label = st === 'off' ? 'Connect ' : st === 'exp' ? 'Reconnect ' : '';
        const tip = st === 'ok' ? `${a.who}: connected. Click to sync.` : `Connect ${a.name}'s Google account`;
        return `<button class="pill ${st}" data-act="pill" data-acct="${k}" style="--c:${a.color}" title="${esc(tip)}"><span class="dot"></span><span class="lbl">${label}</span>${esc(a.name)}</button>`;
      }).join('');
  $('#sync-btn').classList.toggle('spin', ORDER.some(k => ACC[k].loading));
}

function boardHTML() {
  return `<div class="board">${ORDER.map(columnHTML).join('')}</div>
    <p class="keys">Drag to reorder or hand over &middot; <kbd>Alt</kbd>+<kbd>&uarr;&darr;</kbd> move &middot; <kbd>Alt</kbd>+<kbd>&larr;&rarr;</kbd> hand over &middot; <kbd>X</kbd> done &middot; <kbd>Enter</kbd> edit &middot; <kbd>N</kbd> new task &middot; paste a list into "Add a task" to add many</p>`;
}

function columnHTML(k) {
  const a = ACC[k];
  const connected = S.demo || !!a.token;
  const tops = visibleTops(k);
  const listSel = a.lists.length > 1
    ? `<select data-list="${k}" aria-label="Task list">${a.lists.map(l => `<option value="${esc(l.id)}"${l.id === a.listId ? ' selected' : ''}>${esc(l.title)}</option>`).join('')}</select>`
    : '';
  let body;
  if (!connected) {
    body = `<div class="empty"><p>${esc(a.name)}'s Google account isn't connected on this device yet.</p><button class="btn primary" data-act="connect" data-acct="${k}">Connect ${esc(a.name)}</button></div>`;
  } else if (!S.demo && !a.synced) {
    body = `<div class="empty">${a.loading ? 'Loading tasks…'
      : live(a) ? `<button class="btn" data-act="pill" data-acct="${k}">Load tasks</button>`
      : `<button class="btn primary" data-act="connect" data-acct="${k}">Reconnect ${esc(a.name)}</button>`}</div>`;
  } else {
    const active = a.tasks.filter(t => t.listId === a.listId && isActive(t));
    let rows = '';
    for (const t of tops) {
      rows += rowHTML(t, false);
      for (const c of active.filter(x => x.parent && x.parent === t.id)) rows += rowHTML(c, true);
    }
    const done = a.tasks.filter(t => t.listId === a.listId && !isActive(t));
    body = (!S.demo && !live(a) ? `<div class="expired"><span class="grow">Session expired, changes are paused.</span><button class="btn" data-act="connect" data-acct="${k}">Reconnect</button></div>` : '')
      + `<form class="add" data-add="${k}"><input id="add-${k}" autocomplete="off" placeholder="Add a task" value="${esc(S.drafts[k] || '')}"></form>`
      + `<ul class="list act">${rows || '<li class="none">Nothing open here.</li>'}</ul>`
      + (done.length ? `<details class="donebox" data-acct="${k}"${S.doneOpen[k] ? ' open' : ''}><summary>Completed &middot; ${done.length}</summary><ul class="list">${done.map(t => rowHTML(t, false)).join('')}</ul></details>` : '');
  }
  return `<section class="col" style="--c:${a.color}"${connected ? ` data-drop="list" data-acct="${k}"` : ''}>
    <header class="col-h"><span class="dot"></span><b>${esc(a.name)}</b><span class="email">${esc(a.who || a.email || '')}</span>
      <span class="r">${listSel}<span class="count" title="Open tasks">${connected ? tops.length : ''}</span></span></header>
    ${body}
  </section>`;
}

function dueHTML(t) {
  if (!t.due) return '';
  const over = isActive(t) && t.due < todayKey();
  return `<span class="due${over ? ' over' : ''}">${esc(dayLabel(t.due))}${t.time ? ' ' + t.time : ''}</span>`;
}

function rowHTML(t, sub) {
  const done = !isActive(t);
  const open = S.open === t.uid;
  const attrs = done ? '' : ` data-drag${sub ? '' : ' data-top'}`;
  return `<li class="row${sub ? ' sub' : ''}${done ? ' done' : ''}${open ? ' open' : ''}" data-uid="${t.uid}"${attrs} tabindex="0">
      ${done ? '' : `<span class="grip">${ICON.grip}</span>`}
      <button class="chk" data-act="toggle" aria-label="${done ? 'Mark as not done' : 'Mark as done'}">${ICON.check}</button>
      <span class="title">${esc(t.title) || '<i>Untitled</i>'}</span>
      <span class="meta">${t.notes ? `<span title="Has notes">${ICON.note}</span>` : ''}${dueHTML(t)}</span>
    </li>${open ? editorHTML(t) : ''}`;
}

function editorHTML(t) {
  const u = t.uid;
  return `<li class="editor" data-uid="${u}">
    <input id="ed-title-${u}" class="ed-title" data-field="title" value="${esc(t.title)}" placeholder="Title" autocomplete="off">
    <textarea id="ed-notes-${u}" data-field="notes" rows="3" placeholder="Notes">${esc(t.notes)}</textarea>
    <div class="ed-row">
      <label>Date <input id="ed-due-${u}" type="date" data-field="due" value="${t.due || ''}"></label>
      <label>Time <input id="ed-time-${u}" type="time" step="900" data-field="time" value="${t.time || ''}"${t.due ? '' : ' disabled title="Pick a date first"'}></label>
      <span class="grow"></span>
      ${ORDER.filter(k => k !== t.acct).map(k => `<button class="btn" data-act="handover" data-to="${k}">Give to ${esc(ACC[k].name)}</button>`).join('')}
      ${t.link ? `<a class="btn" href="${esc(t.link)}" target="_blank" rel="noopener">Open in Google</a>` : ''}
      <button class="btn danger" data-act="delete">Delete</button>
    </div>
  </li>`;
}

function dayHTML() {
  const date = S.date, today = todayKey();
  const timed = allTasks().filter(t => t.due === date && t.time);
  const events = ORDER.flatMap(k => (ACC[k].events[date] || []).map(e => ({ ...e, acct: k })));
  const allDay = events.filter(e => e.allDay), evs = events.filter(e => !e.allDay);
  const nowMin = date === today ? nowMinutes() : -1;
  let start = CONFIG.dayStart * 60, end = CONFIG.dayEnd * 60;
  for (const m of [...timed.map(t => toMin(t.time)), ...(nowMin >= 0 ? [nowMin] : [])]) {
    start = Math.min(start, Math.floor(m / 60) * 60);
    end = Math.max(end, Math.floor(m / 30) * 30 + 30);
  }
  S.nowSlot = nowMin >= 0 ? Math.floor(nowMin / 30) : -1;

  let slots = '';
  for (let m = start; m < end; m += 30) {
    const here = timed.filter(t => { const x = toMin(t.time); return x >= m && x < m + 30; }).sort((p, q) => p.time.localeCompare(q.time));
    const busy = evs.filter(e => e.start < m + 30 && e.end > m);
    const labels = evs.filter(e => (e.start >= m && e.start < m + 30) || (m === start && e.start < start && e.end > start));
    const owners = [...new Set(busy.map(e => e.acct))];
    const tint = owners.length === 1 ? ACC[owners[0]].color : 'var(--faint)';
    const now = nowMin >= m && nowMin < m + 30;
    slots += `<div class="slot${m % 60 ? '' : ' hour'}${busy.length ? ' busy' : ''}${now ? ' now' : ''}" data-drop="slot" data-time="${toHHMM(m)}"${busy.length ? ` style="--busy:${tint}"` : ''}>
      <span class="tl">${m % 60 ? '' : toHHMM(m)}</span>
      <div class="sb">${labels.map(evHTML).join('')}${here.map(chipHTML).join('')}</div>
    </div>`;
  }

  const picked = S.pick ? T(S.pick) : null;
  const title = parseKey(date).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  return `<div class="dayhead">
      <button class="icon" data-act="day" data-d="-1" title="Previous day (←)" aria-label="Previous day">${ICON.left}</button>
      <button class="btn" data-act="day" data-d="0"${date === today ? ' disabled' : ''}>Today</button>
      <button class="icon" data-act="day" data-d="1" title="Next day (→)" aria-label="Next day">${ICON.right}</button>
      <h2>${esc(title)}</h2>
      <input id="day-pick" type="date" value="${date}" aria-label="Pick a date">
      <span class="grow"></span>
      <span class="legend">${ORDER.map(k => `<span style="--c:${ACC[k].color}"><span class="dot"></span>${esc(ACC[k].name)}</span>`).join('')}</span>
    </div>
    ${picked ? `<div class="pickbar"><span class="grow">Tap an hour to place <b>${esc(picked.title)}</b></span><button class="btn" data-act="unpick">Cancel</button></div>` : ''}
    <div class="day">
      ${sideHTML(date)}
      <section class="grid${picked ? ' picking' : ''}" aria-label="Schedule">
        ${allDay.length ? `<div class="allday"><span class="tl">all day</span><div class="sb">${allDay.map(evHTML).join('')}</div></div>` : ''}
        ${slots}
      </section>
    </div>`;
}

function sideHTML(date) {
  const q = S.sideFilter.trim().toLowerCase();
  const isToday = date === todayKey();
  const pool = allTasks().filter(t => isActive(t) && !(t.due === date && t.time) && (!q || t.title.toLowerCase().includes(q)));
  const groups = [
    [isToday ? 'Overdue' : 'Earlier', t => t.due && t.due < date],
    [isToday ? 'Today' : dayLabel(date), t => t.due === date],
    ['No date', t => !t.due],
    ['Later', t => t.due && t.due > date],
  ];
  const body = groups.map(([label, test]) => {
    const g = pool.filter(test);
    return g.length ? `<h4>${esc(label)} &middot; ${g.length}</h4><ul class="items">${g.map(t => itemHTML(t, date)).join('')}</ul>` : '';
  }).join('');
  return `<aside class="side" id="side" data-drop="unsched" aria-label="Tasks to schedule">
    <div class="side-h"><b>To schedule</b><input id="side-filter" type="search" placeholder="Filter" value="${esc(S.sideFilter)}" autocomplete="off"></div>
    ${body || `<p class="hint">${q ? 'No matches.' : 'Nothing left to schedule.'}</p>`}
    <p class="hint">Drag a task onto an hour, or tap it and then tap an hour. Drop a block back here to unschedule it.</p>
  </aside>`;
}

function itemHTML(t, date) {
  const label = t.due && (t.due !== date || t.time) ? dueHTML(t) : '';
  return `<li class="item${S.pick === t.uid ? ' picked' : ''}" data-uid="${t.uid}" data-drag style="--c:${ACC[t.acct].color}">
    <span class="grip">${ICON.grip}</span><span class="dot"></span><span class="title">${esc(t.title) || '<i>Untitled</i>'}</span>${label}</li>`;
}

function chipHTML(t) {
  const done = !isActive(t);
  const offGrid = !t.time.endsWith(':00') && !t.time.endsWith(':30');
  return `<div class="chip${done ? ' done' : ''}${S.pick === t.uid ? ' picked' : ''}" data-uid="${t.uid}"${done ? '' : ' data-drag'} style="--c:${ACC[t.acct].color}" title="${esc(ACC[t.acct].name)}: ${esc(t.title)}">
    <span class="grip">${ICON.grip}</span>
    <button class="chk" data-act="toggle" aria-label="${done ? 'Mark as not done' : 'Mark as done'}">${ICON.check}</button>
    <span class="title">${esc(t.title) || '<i>Untitled</i>'}</span>${offGrid ? `<span class="tm">${t.time}</span>` : ''}
    <button class="x" data-act="unschedule" title="Unschedule" aria-label="Unschedule">&times;</button>
  </div>`;
}

function evHTML(e) {
  const when = e.allDay ? '' : `<b>${toHHMM(e.start)}–${toHHMM(e.end)}</b> `;
  return `<span class="ev" style="--c:${ACC[e.acct].color}" title="${esc(ACC[e.acct].name)}'s calendar: ${esc(e.title)}">${when}${esc(e.title)}</span>`;
}

      <li>Under <b>Clients → Create client</b>, choose <b>Web application</b>. Add <code>${esc(origin || 'https://YOUR-NAME.github.io')}</code> under <b>Authorized JavaScript origins</b> and <code>${esc(site)}</code> under <b>Authorized redirect URIs</b>. Copy the Client ID.</li>
      <li>Paste the Client ID below, then connect each person. Every device asks for it once; to skip that, put it in the <code>clientId</code> line near the top of <code>index.html</code>.</li>
    </ol>
    <label class="field">OAuth Client ID<input id="cid" value="${esc(S.clientId)}" placeholder="1234567890-abc123.apps.googleusercontent.com" autocomplete="off" spellcheck="false"${CONFIG.clientId || PREVIEW ? ' readonly' : ''}></label>
    ${ORDER.map(k => {
      const a = ACC[k];
      const st = !a.token ? 'not connected' : live(a) ? 'connected' : 'session expired';
      const can = S.clientId && !S.demo;
      return `<div class="acct-row" style="--c:${a.color}"><span class="dot"></span><b>${esc(a.name)}</b><span class="muted">${esc(a.who || 'Google account')} &middot; ${st}</span><span class="grow"></span>
        ${a.token ? `<button type="button" class="btn" data-act="disconnect" data-acct="${k}">Disconnect</button>` : ''}
        <button type="button" class="btn${a.token ? '' : ' primary'}" data-act="connect" data-acct="${k}"${can ? '' : ' disabled title="Save a Client ID first"'}>${a.token ? 'Reconnect' : 'Connect'}</button></div>`;
    }).join('')}
    <footer><button class="btn" value="close">Close</button><button type="button" class="btn primary" data-act="save-cid"${CONFIG.clientId || PREVIEW ? ' disabled' : ''}>Save Client ID</button></footer>
  </form>`;
  if (!dlg.open) dlg.showModal();
}

function saveClientId() {
  const v = $('#cid').value.trim();
  if (v && !/\.apps\.googleusercontent\.com$/.test(v)) return toast('That doesn\'t look like an OAuth Client ID. It ends with .apps.googleusercontent.com.');
  const wasDemo = S.demo;
  S.clientId = v;
  S.demo = !v;
  savePrefs();
  if (wasDemo !== S.demo) {
    for (const k of ORDER) Object.assign(ACC[k], { tasks: [], lists: [], events: {}, listId: null, synced: 0 });
    S.open = S.pick = null;
    if (S.demo) loadDemo(); else ORDER.forEach(k => sync(k));
  }
  toast(v ? 'Client ID saved. Now connect each account.' : 'Client ID removed. Showing demo data.');
  openSettings();
  render();
}

// ---------------------------------------------------------------------------
// Toasts
// ---------------------------------------------------------------------------
function toast(msg, action, ms = 4000) {
  const box = $('#toasts');
  [...box.children].forEach(el => { if (el.dataset.msg === msg) el.remove(); });
  while (box.children.length >= 3) box.firstChild.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.dataset.msg = msg;
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if (action) {
    const b = document.createElement('button');
    b.textContent = action.label;
    b.addEventListener('click', () => { el.remove(); action.run(); });
    el.appendChild(b);
  }
  box.appendChild(el);
  setTimeout(() => el.remove(), action ? Math.max(ms, 6000) : ms);
}

// ---------------------------------------------------------------------------
// Drag and drop (pointer events: mouse, pen and touch via the grip handle)
// ---------------------------------------------------------------------------
let drag = null;
let suppressClickUntil = 0;
const dropline = $('#dropline');

document.addEventListener('pointerdown', e => {
  suppressClickUntil = 0;   // only the click that ends a drag is swallowed
  if (e.button !== 0 || drag) return;
  const src = e.target.closest('[data-drag]');
  if (!src || e.target.closest('button, input, textarea, select, a, summary')) return;
  const touch = e.pointerType !== 'mouse';
  if (touch && !e.target.closest('.grip')) return;   // on touch, drag from the grip; tapping picks instead
  drag = { uid: src.dataset.uid, src, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, id: e.pointerId, active: false, target: null };
  if (touch) startDrag();
});

window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.x = e.clientX;
  drag.y = e.clientY;
  if (!drag.active) {
    if (Math.hypot(drag.x - drag.x0, drag.y - drag.y0) < 5) return;
    startDrag();
  }
  e.preventDefault();
  placeGhost();
  updateTarget();
});
window.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.id) endDrag(true); });
window.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.id) endDrag(false); });
document.addEventListener('touchmove', e => { if (drag?.active) e.preventDefault(); }, { passive: false });
document.addEventListener('click', e => {
  if (performance.now() < suppressClickUntil) { e.preventDefault(); e.stopPropagation(); }
}, true);

function startDrag() {
  const d = drag;
  d.active = true;
  const r = d.src.getBoundingClientRect();
  d.dx = d.x0 - r.left;
  d.dy = d.y0 - r.top;
  const g = d.src.cloneNode(true);
  g.classList.add('ghost');
  g.removeAttribute('tabindex');
  g.style.width = r.width + 'px';
  g.style.setProperty('--c', getComputedStyle(d.src).getPropertyValue('--c'));
  document.body.appendChild(g);
  d.ghost = g;
  d.src.classList.add('dragging');
  document.body.classList.add('is-dragging');
  window.getSelection()?.removeAllRanges();
  placeGhost();
  updateTarget();
  requestAnimationFrame(autoScroll);
}

function placeGhost() {
  drag.ghost.style.transform = `translate(${drag.x - drag.dx}px, ${drag.y - drag.dy}px)`;
}

function clearMarks() {
  dropline.style.display = 'none';
  document.querySelectorAll('.over').forEach(el => el.classList.remove('over'));
}

function updateTarget() {
  const d = drag;
  clearMarks();
  d.target = null;
  const zone = document.elementFromPoint(d.x, d.y)?.closest('[data-drop]');
  if (!zone) return;
  const kind = zone.dataset.drop;
  if (kind === 'list') {
    const ul = zone.querySelector('ul.act');
    if (!ul) return;
    const rows = [...ul.querySelectorAll(':scope > .row[data-top]')].filter(r => r.dataset.uid !== d.uid);
    const before = rows.find(r => { const b = r.getBoundingClientRect(); return d.y < b.top + b.height / 2; }) || null;
    d.target = { kind, acct: zone.dataset.acct, before: before ? before.dataset.uid : null };
    const ur = ul.getBoundingClientRect();
    let y;
    if (before) y = before.getBoundingClientRect().top;
    else { const last = [...ul.children].filter(c => c !== d.src).pop(); y = last ? last.getBoundingClientRect().bottom : ur.top + 6; }
    Object.assign(dropline.style, { display: 'block', left: ur.left + 10 + 'px', width: ur.width - 20 + 'px', top: y - 1 + 'px' });
    if (zone.dataset.acct !== T(d.uid)?.acct) zone.classList.add('over');
  } else if (kind === 'slot') {
    zone.classList.add('over');
    d.target = { kind, time: zone.dataset.time };
  } else if (kind === 'unsched') {
    zone.classList.add('over');
    d.target = { kind };
  }
}

function autoScroll() {
  if (!drag?.active) return;
  const top = $('.top').getBoundingClientRect().bottom + 40, bottom = innerHeight - 50;
  const v = drag.y < top ? -Math.ceil((top - drag.y) / 3) : drag.y > bottom ? Math.ceil((drag.y - bottom) / 3) : 0;
  if (v) { window.scrollBy(0, Math.max(-30, Math.min(30, v))); updateTarget(); }
  requestAnimationFrame(autoScroll);
}

function endDrag(commit) {
  const d = drag;
  drag = null;
  if (!d.active) return;
  suppressClickUntil = performance.now() + 350;
  d.ghost.remove();
  d.src.classList.remove('dragging');
  document.body.classList.remove('is-dragging');
  clearMarks();
  const t = T(d.uid);
  const tg = d.target;
  if (commit && t && tg) {
    if (tg.kind === 'list') tg.acct === t.acct ? reorder(t, tg.before) : moveAcross(t, tg.acct, tg.before);
    else if (tg.kind === 'slot') schedule(t, S.date, tg.time);
    else if (tg.kind === 'unsched' && t.time) patch(t, { time: null });
  }
  render();
}

// ---------------------------------------------------------------------------
// Clicks, inputs and keys
// ---------------------------------------------------------------------------
function setView(v) {
  S.view = v;
  S.pick = null;
  savePrefs();
  render();
  if (v === 'day') { loadEventsAll(); scrollToNow(); }
}
function goDay(delta) {
  S.date = delta === 0 ? todayKey() : addDays(S.date, delta);
  S.pick = null;
  render();
  loadEventsAll();
  if (delta === 0) scrollToNow();
}
function scrollToNow() {
  if (!matchMedia('(min-width: 761px)').matches) return;   // stacked layout: keep the task list in view
  const el = $('.slot.now') || $('.chip');
  if (el) el.scrollIntoView({ block: 'center' });
}
function openEditor(t) {
  flushEditor();
  S.open = S.open === t.uid ? null : t.uid;
  if (!S.open) S.focus = t.uid;
  render();
  if (S.open && matchMedia('(pointer: fine)').matches) document.getElementById('ed-title-' + t.uid)?.focus();
}
function closeEditor() {
  if (!S.open) return;
  flushEditor();
  S.focus = S.open;
  S.open = null;
  render();
}
// Save whatever is typed in the open editor (fields only save on change/blur otherwise).
function flushEditor() {
  const t = S.open && T(S.open);
  if (!t) return;
  const title = document.getElementById('ed-title-' + t.uid), notes = document.getElementById('ed-notes-' + t.uid);
  if (title && title.value.trim() && title.value.trim() !== t.title) patch(t, { title: title.value.trim() }, true);
  if (notes && notes.value !== t.notes) patch(t, { notes: notes.value }, true);
}
function saveField(t, field, v) {
  if (field === 'title') { v = v.trim(); if (v && v !== t.title) patch(t, { title: v }, true); }
  else if (field === 'notes') { if (v !== t.notes) patch(t, { notes: v }, true); }
  else if (field === 'due') { if ((v || null) !== t.due) patch(t, { due: v || null }); }
  else if (field === 'time') { if ((v || null) !== t.time) patch(t, { time: v || null }); }
}
function neighbourUid(row) {
  const rows = [...document.querySelectorAll('#main .row')];
  const i = rows.indexOf(row);
  return (rows[i + 1] || rows[i - 1])?.dataset.uid || null;
}

document.addEventListener('click', e => {
  const actEl = e.target.closest('[data-act]');
  const host = e.target.closest('[data-uid]');
  const t = host ? T(host.dataset.uid) : null;
  if (actEl) {
    const k = actEl.dataset.acct;
    switch (actEl.dataset.act) {
      case 'view': return setView(actEl.dataset.view);
      case 'sync': return syncAll();
      case 'settings': return openSettings();
      case 'save-cid': return saveClientId();
      case 'connect': return reconnect(k);
      case 'disconnect': return disconnect(k);
      case 'pill': return live(ACC[k]) ? sync(k) : reconnect(k);
      case 'day': return goDay(Number(actEl.dataset.d));
      case 'unpick': S.pick = null; return render();
      case 'toggle': return t && toggleDone(t);
      case 'delete': return t && del(t);
      case 'unschedule': return t && patch(t, { time: null });
      case 'handover': if (t) { flushEditor(); moveAcross(t, actEl.dataset.to, 'top'); } return;
    }
    return;
  }
  if (e.target.closest('.editor, a, input, textarea, select, summary')) return;
  if (t && host.matches('.row')) return openEditor(t);
  if (t && host.matches('.item, .chip')) {
    S.pick = S.pick === t.uid ? null : t.uid;
    render();
    // Stacked phone layout: bring the hours into view after picking a task from the list.
    if (S.pick && host.matches('.item') && !matchMedia('(min-width: 761px)').matches) {
      ($('.slot.now') || $('.grid'))?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    return;
  }
  const slot = e.target.closest('.slot');
  if (slot && S.pick) {
    const p = T(S.pick);
    S.pick = null;
    if (p) schedule(p, S.date, slot.dataset.time);
    render();
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('[data-field]')) {
    const t = T(el.closest('[data-uid]').dataset.uid);
    if (t) saveField(t, el.dataset.field, el.value);
  } else if (el.matches('[data-list]')) {
    ACC[el.dataset.list].listId = el.value;
    S.open = null;
    savePrefs();
    render();
  } else if (el.id === 'day-pick' && el.value) {
    S.date = el.value;
    render();
    loadEventsAll();
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'side-filter') { S.sideFilter = e.target.value; render(); }
  const form = e.target.closest('form[data-add]');
  if (form) S.drafts[form.dataset.add] = e.target.value;
});

document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-add]');
  if (!form) return;
  e.preventDefault();
  const k = form.dataset.add, input = form.querySelector('input');
  const title = input.value;
  input.value = '';
  S.drafts[k] = '';
  addTasks(k, [title]);
});

document.addEventListener('paste', e => {
  const form = e.target.closest?.('form[data-add]');
  const text = e.clipboardData?.getData('text') || '';
  if (!form || !/\n/.test(text.trim())) return;
  e.preventDefault();
  const lines = text.split(/\r?\n/).map(l => l.replace(/^\s*(?:(?:[-*•☐☑]|\[[ xX]?\]|\d+[.)](?=\s))\s*)+/, '').trim()).filter(Boolean);
  addTasks(form.dataset.add, lines);
  toast(`Added ${lines.length} tasks to ${ACC[form.dataset.add].name}.`);
});

document.addEventListener('toggle', e => {
  if (e.target.matches?.('details.donebox')) S.doneOpen[e.target.dataset.acct] = e.target.open;
}, true);

document.addEventListener('keydown', e => {
  if ($('#dlg').open) return;
  const el = e.target;
  if (e.key === 'Escape') {
    if (S.pick) { S.pick = null; render(); }
    else if (S.open) closeEditor();
    else if (el.matches('input, textarea')) el.blur();
    return;
  }
  if (el.matches('.ed-title') && e.key === 'Enter') { e.preventDefault(); return closeEditor(); }
  if (el.matches('input, textarea, select') || e.metaKey || e.ctrlKey) return;

  const row = el.closest?.('.row');
  const t = row ? T(row.dataset.uid) : null;
  if (t) {
    const arrow = { ArrowUp: -1, ArrowDown: 1 }[e.key];
    const side = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
    if (e.altKey && arrow && isActive(t)) { e.preventDefault(); return nudge(t, arrow); }
    if (e.altKey && side && isActive(t)) {
      e.preventDefault();
      const to = ORDER[ORDER.indexOf(t.acct) + side];
      if (to) { S.focus = t.uid; moveAcross(t, to, 'top'); }
      return;
    }
    if (arrow) {
      e.preventDefault();
      const rows = [...document.querySelectorAll('#main .row')];
      rows[rows.indexOf(row) + arrow]?.focus();
      return;
    }
    if (e.key === 'x' || e.key === 'X' || e.key === ' ') { e.preventDefault(); S.focus = isActive(t) ? neighbourUid(row) : t.uid; return toggleDone(t); }
    if (e.key === 'Enter') { e.preventDefault(); return openEditor(t); }
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); S.focus = neighbourUid(row); return del(t); }
  }
  if (e.altKey) return;
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (key === 'n' && S.view === 'board') { e.preventDefault(); $('form[data-add] input')?.focus(); }
  else if (key === 'b') setView('board');
  else if (key === 'd') setView('day');
  else if (key === 'r') syncAll();
  else if (S.view === 'day' && key === 'ArrowLeft') goDay(-1);
  else if (S.view === 'day' && key === 'ArrowRight') goDay(1);
  else if (S.view === 'day' && key === 't') goDay(0);
});

function autoSync() {
  if (document.visibilityState !== 'visible') return;
  for (const k of ORDER) { const a = ACC[k]; if (live(a) && !a.loading && Date.now() - a.synced > 30000) sync(k); }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const busy = S.open || drag || Object.values(S.drafts).some(Boolean);
  if (!busy && renewExpired()) return;
  autoSync();
});
window.addEventListener('focus', autoSync);

let liveSig = '';
setInterval(() => {
  const sig = ORDER.map(k => live(ACC[k])).join();
  const slotNow = S.date === todayKey() ? Math.floor(nowMinutes() / 30) : -1;
  if (sig !== liveSig || (S.view === 'day' && slotNow !== S.nowSlot)) { liveSig = sig; render(); }
}, 30000);

// ---------------------------------------------------------------------------
// Demo data (shown until a Client ID is saved)
// ---------------------------------------------------------------------------
function loadDemo() {
  const d0 = todayKey();
  const [p, q] = ORDER;
  const mk = (k, title, extra = {}) => ({ ...blankTask(k, 'demo', title), id: 'demo_' + newUid(), ...extra });
  const gate = mk(p, 'Fix the garden gate latch');
  ACC[p].tasks = [
    mk(p, 'Book car service and tyre swap', { due: d0, time: '09:00' }),
    mk(p, 'Call the accountant about Q3', { due: d0 }),
    mk(p, 'Pay electricity and internet bills', { due: addDays(d0, -1) }),
    gate,
    mk(p, 'Order a new latch online', { parent: gate.id }),
    mk(p, 'Renew passport photos', { notes: 'Photo booth at the post office' }),
    mk(p, 'Back up the family photo library', { status: 'completed', completed: new Date().toISOString() }),
  ];
  ACC[q].tasks = [
    mk(q, 'Weekly groceries and meal plan', { due: d0, time: '17:30' }),
    mk(q, 'Confirm the weekend hotel', { due: d0 }),
    mk(q, 'Dentist appointment for the kids', { due: addDays(d0, 2) }),
    mk(q, 'Return parcel to the post office'),
    mk(q, 'Birthday present for Ola'),
  ];
  for (const k of ORDER) Object.assign(ACC[k], { lists: [{ id: 'demo', title: 'My Tasks' }], listId: 'demo', events: {} });
  ACC[p].events[d0] = [{ title: 'Team stand-up', allDay: false, start: 600, end: 630 }, { title: 'Lunch with Marek', allDay: false, start: 780, end: 840 }];
  if (q) ACC[q].events[d0] = [{ title: 'Yoga', allDay: false, start: 1110, end: 1170 }];
}

// ---------------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------------
(async () => {
  $('#brand').insertAdjacentHTML('afterbegin', ICON.logo);
  $('#sync-btn').innerHTML = ICON.sync;
  $('#gear-btn').innerHTML = ICON.gear;
  if (S.demo) loadDemo();
  render();
  await finishSignIn();
  if (renewExpired()) return;   // leaving for a moment to refresh a Google session
  liveSig = ORDER.map(k => live(ACC[k])).join();
  render();
  if (!S.demo) ORDER.forEach(k => live(ACC[k]) && sync(k));
  if (S.view === 'day') { loadEventsAll(); scrollToNow(); }
})();
</script>
</body>
